<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvio Collection - Galerie & Liens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: #131b2e;
      --bg-card-hover: #1c2742;
      --accent-primary: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 5rem;
    }

    header {
      background: linear-gradient(180deg, #10172a 0%, var(--bg-main) 100%);
      border-bottom: 1px solid var(--border-color);
      padding: 3rem 1.5rem 2rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 1.5rem;
    }

    .badge-count {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .search-bar-container {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 1.25rem 0.85rem 3rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1.25rem;
    }

    .filter-btn {
      background: #1e293b;
      color: var(--text-muted);
      border: 1px solid transparent;
      padding: 0.4rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-primary);
      color: #fff;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    main {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .category-section {
      margin-bottom: 3.5rem;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
    }

    .category-title {
      font-size: 1.5rem;
      font-weight: 700;
      text-transform: capitalize;
    }

    .category-group-tag {
      background: #1e293b;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .image-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
    }

    .image-card:hover {
      transform: translateY(-4px);
      background: var(--bg-card-hover);
      border-color: #3b82f6;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .thumb-wrapper {
      height: 180px;
      background: #0b0f19;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      position: relative;
    }

    .thumb-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .format-badge {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .card-body {
      padding: 1rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .file-name {
      font-size: 0.875rem;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.75rem;
      font-family: monospace;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.55rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      width: 100%;
      text-decoration: none;
    }

    .btn-cdn {
      background: var(--accent-primary);
      color: #fff;
    }

    .btn-cdn:hover {
      background: #4f46e5;
    }

    .btn-raw {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }

    .btn-raw:hover {
      background: #334155;
      color: #fff;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: #fff;
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .empty-state {
      text-align: center;
      padding: 5rem 1rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <h1>🎬 Nuvio Collection</h1>
      <p class="subtitle">Logos, bannières et affiches hébergés sur GitHub avec CDN haute performance</p>
      <div class="badge-count">199 images disponibles • 64 catégories</div>
      
      <div class="search-bar-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Rechercher une catégorie ou une image (ex: Marvel, Netflix, 1980)...">
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">Tous</button>
        <button class="filter-btn" data-filter="Plateformes Streaming">Streaming</button>
        <button class="filter-btn" data-filter="Sagas & Franchises">Sagas & Franchises</button>
        <button class="filter-btn" data-filter="Décennies">Décennies</button>
        <button class="filter-btn" data-filter="Genres & Sélections">Genres</button>
      </div>
    </div>
  </header>

  <main id="contentContainer">
    <!-- Categories will be rendered here -->
  </main>

    let currentFilter = 'all';
    let searchQuery = '';

    const container = document.getElementById('contentContainer');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('✅ Lien ' + label + ' copié !');
      }).catch(err => {
        const input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast('✅ Lien ' + label + ' copié !');
      });
    }

    function render() {
      container.innerHTML = '';
      let matchCount = 0;

      data.forEach(cat => {
        if (currentFilter !== 'all' && cat.group !== currentFilter) return;

        const filteredImages = cat.images.filter(img => {
          const matchCat = cat.category.toLowerCase().includes(searchQuery);
          const matchImg = img.filename.toLowerCase().includes(searchQuery);
          return matchCat || matchImg;
        });

        if (filteredImages.length === 0) return;
        matchCount += filteredImages.length;

        const section = document.createElement('div');
        section.className = 'category-section';

        section.innerHTML = `
          <div class="category-header">
            <h2 class="category-title">${cat.category}</h2>
            <span class="category-group-tag">${cat.group}</span>
          </div>
          <div class="images-grid">
            ${filteredImages.map(img => `
              <div class="image-card">
                <div class="thumb-wrapper">
                  <span class="format-badge">${img.format}</span>
                  <img src="${img.rel_path}" alt="${img.filename}" loading="lazy" onerror="this.src='${img.cdn_url}'">
                </div>
                <div class="card-body">
                  <div class="file-name" title="${img.filename}">${img.filename}</div>
                  <div class="actions">
                    <button class="btn btn-cdn" onclick="copyToClipboard('${img.cdn_url}', 'CDN')">
                      📋 Copier Lien CDN (jsDelivr)
                    </button>
                    <button class="btn btn-raw" onclick="copyToClipboard('${img.raw_url}', 'Raw')">
                      📋 Copier Lien GitHub Raw
                    </button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;

        container.appendChild(section);
      });

      if (matchCount === 0) {
        container.innerHTML = '<div class="empty-state"><h3>Aucun résultat trouvé</h3><p>Essayez un autre mot-clé ou réinitialisez les filtres.</p></div>';
      }
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      render();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    render();
  </script>
